{% extends "base.html" %}

{% block title %}{{ item["name"] }}{% endblock %}

{% block content %}
  <!-- TODO: show the fields for your dataset -->
  <h2>{{ item["name"] }}</h2>
  <p><strong>Category:</strong> {{ item["category"] }}</p>
  <p><strong>Year:</strong> {{ item["year"] }}</p>

  <p class="actions">
    <a class="button" href="{{ url_for('edit_item', item_id=item['id']) }}">Edit</a>
    <form method="post" action="{{ url_for('remove_item', item_id=item['id']) }}"
          onsubmit="return confirm('Delete this item?');">
      <button type="submit" class="danger">Delete</button>
    </form>
  </p>
  <p><a href="{{ url_for('home') }}">&larr; Back to list</a></p>
{% endblock %}
