{% extends "base.html" %}

{% block title %}All Items{% endblock %}

{% block content %}
  <p>{{ items|length }} items</p>

  <table>
    <thead>
      <tr>
        <!-- TODO: change headers to match your columns -->
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Year</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}
      <tr>
        <td>{{ item["id"] }}</td>
        <td>
          <a href="{{ url_for('item_detail', item_id=item['id']) }}">{{ item["name"] }}</a>
        </td>
        <td>{{ item["category"] }}</td>
        <td>{{ item["year"] }}</td>
        <td class="actions">
          <a href="{{ url_for('edit_item', item_id=item['id']) }}">Edit</a>
          <form method="post" action="{{ url_for('remove_item', item_id=item['id']) }}"
                onsubmit="return confirm('Delete this item?');">
            <button type="submit" class="danger">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="5">No items yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
