{% extends "base.html" %}

{% block title %}
  {% if action == "edit" %}Edit item{% else %}Add item{% endif %}
{% endblock %}

{% block content %}
  <h2>{% if action == "edit" %}Edit item{% else %}Add item{% endif %}</h2>

  <!-- TODO: change input name=... attributes to match your columns -->
  <form method="post"
        action="{% if action == 'edit' %}{{ url_for('edit_item', item_id=item['id']) }}{% else %}{{ url_for('create_item') }}{% endif %}">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required
           value="{% if item is defined %}{{ item['name'] }}{% endif %}">

    <label for="category">Category</label>
    <input type="text" id="category" name="category"
           value="{% if item is defined %}{{ item['category'] }}{% endif %}">

    <label for="year">Year</label>
    <input type="number" id="year" name="year"
           value="{% if item is defined %}{{ item['year'] }}{% endif %}">

    <button type="submit">{% if action == "edit" %}Update{% else %}Save{% endif %}</button>
    <a href="{{ url_for('home') }}">Cancel</a>
  </form>
{% endblock %}
